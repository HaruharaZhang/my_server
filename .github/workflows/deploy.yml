name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy changed components
    runs-on: ubuntu-latest
    environment: production
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: vars.DEPLOY_ENABLED == 'true'
        with:
          fetch-depth: 2
      - name: Select components
        if: vars.DEPLOY_ENABLED == 'true'
        id: changes
        env:
          BEFORE: ${{ github.event.before || '0000000000000000000000000000000000000000' }}
          SHA: ${{ github.sha }}
        run: |
          components=$(deploy/ci/select-components.sh "$BEFORE" "$SHA")
          echo "components=$components" >> "$GITHUB_OUTPUT"
      - name: Configure SSH
        if: vars.DEPLOY_ENABLED == 'true' && steps.changes.outputs.components != ''
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Fetch and activate release
        if: vars.DEPLOY_ENABLED == 'true' && steps.changes.outputs.components != ''
        env:
          COMPONENTS: ${{ steps.changes.outputs.components }}
          HOST: ${{ vars.DEPLOY_HOST }}
          PORT: ${{ vars.DEPLOY_PORT }}
          USER: ${{ vars.DEPLOY_USER }}
          SHA: ${{ github.sha }}
        run: ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" sudo /usr/local/sbin/deploy-my-server "$SHA" "$COMPONENTS"
