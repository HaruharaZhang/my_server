name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: Python tests (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [bilibili-relay, youtube-relay, news-pipeline, status-dashboard]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: z_my_server/${{ matrix.component }}/requirements.txt
      - name: Install dependencies
        working-directory: z_my_server/${{ matrix.component }}
        run: |
          if [[ -f requirements.txt ]]; then python -m pip install -r requirements.txt; fi
      - name: Compile
        run: python -m compileall -q "z_my_server/${{ matrix.component }}"
      - name: Test
        working-directory: z_my_server/${{ matrix.component }}
        run: python -m unittest discover -s tests -p 'test_*.py'

  astro:
    name: Astro build
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: z_my_server/xiaoyu/VRChat-Category
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: z_my_server/xiaoyu/VRChat-Category/package-lock.json
      - run: npm ci
      - run: npm run build

  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate shell and JSON
        run: |
          find deploy z_my_server -type f -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning
          find z_my_server -type f -name '*.json' \
            -not -path '*/node_modules/*' -not -path '*/dist/*' -print0 | xargs -0 -n1 jq empty
      - name: Test deployment controls
        run: |
          deploy/tests/test-select-components.sh
          deploy/tests/test-deploy-contract.sh
      - name: Validate JavaScript
        run: |
          find z_my_server/status-dashboard z_my_server/youtube-relay/chrome-extension \
            -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  required:
    name: CI / required
    if: always()
    needs: [secrets, python, astro, static]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          SECRETS_RESULT: ${{ needs.secrets.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          ASTRO_RESULT: ${{ needs.astro.result }}
          STATIC_RESULT: ${{ needs.static.result }}
        run: |
          test "$SECRETS_RESULT" = success
          test "$PYTHON_RESULT" = success
          test "$ASTRO_RESULT" = success
          test "$STATIC_RESULT" = success
